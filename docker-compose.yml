services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nilou}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nilou}
      POSTGRES_DB: ${POSTGRES_DB:-nilou}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nilou} -d ${POSTGRES_DB:-nilou}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Exposed for local inspection; remove in production if not needed.
    ports:
      - "5432:5432"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nilou}:${POSTGRES_PASSWORD:-nilou}@db:5432/${POSTGRES_DB:-nilou}?schema=public
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      APP_TIMEZONE: Asia/Tehran
      NODE_ENV: production
      INVITATION_SLUG: ${INVITATION_SLUG:-}
      INVITEE_NAME: ${INVITEE_NAME:-نیلو}
      OWNER_NAME: ${OWNER_NAME:-مجید}
      OWNER_PHONE_LOCAL: ${OWNER_PHONE_LOCAL:-09129284402}
      OWNER_PHONE_E164: ${OWNER_PHONE_E164:-+989129284402}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      PHONE_ENCRYPTION_KEY: ${PHONE_ENCRYPTION_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_TO: ${EMAIL_TO:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      TIME_SLOTS: ${TIME_SLOTS:-}
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  pgdata:
